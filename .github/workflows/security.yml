name: SECURITY SCAN

on:
  push:
    branches:
      - dev
      - staging
      - main

  pull_request:
    branches:
      - dev
      - staging
      - main
jobs:
  # ─── Security scanning (runs in parallel with CI) ────────────────────────────
  security-scan:
    name: Security — Trivy & SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Filesystem scan — catches secrets, misconfigs, and known CVEs in deps
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1           # don't fail the pipeline; let GitHub surface it
          trivyignores: .trivyignore
