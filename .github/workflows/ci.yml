name: CI PIPELINE

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: ${{ secrets.NODE_ENV }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_SYNC: ${{ secrets.DATABASE_SYNC }}
      DATABASE_LOGGING: ${{ secrets.DATABASE_LOGGING }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
      JWT_RESET_SECRET: ${{ secrets.JWT_RESET_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
      BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
      BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
      PROFILE_VIEW_MILESTONES: ${{ secrets.PROFILE_VIEW_MILESTONES }}
      INVITE_EXPIRY_DAYS: ${{ secrets.INVITE_EXPIRY_DAYS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm run lint

      - name: Run migrations
        run: pnpm run migration:run

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm run build