name: DEPLOY BACKEND Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

  push:
    branches:
      # - feat/cd-pipeline
      # - dev
      - staging
      - production
  
  # pull_request:
  #   branches:
  #     - feat/cd-pipeline
  #     - dev
  #     - staging
  #     - main
jobs:

# ─── CI — Lint, Test, Build ───────
  ci:
    name: CI — Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      NODE_ENV: ${{ secrets.NODE_ENV }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_SYNC: ${{ secrets.DATABASE_SYNC }}
      DATABASE_LOGGING: ${{ secrets.DATABASE_LOGGING }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
      JWT_RESET_SECRET: ${{ secrets.JWT_RESET_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
      BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
      BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
      PROFILE_VIEW_MILESTONES: ${{ secrets.PROFILE_VIEW_MILESTONES }}
      INVITE_EXPIRY_DAYS: ${{ secrets.INVITE_EXPIRY_DAYS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

      - name: Run migrations
        run: pnpm run migration:run

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm run build

  deploy-staging:
    name: Deploy — Staging
    needs: ci
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    #environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean stale source files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            rm -rf /var/www/openprofile-be/staging/src

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./"
          target: /var/www/openprofile-be/staging

          
      - name: Copy env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/openprofile-be
            cp envfile/.env.staging  staging/.env

      - name: Install dependencies and build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/openprofile-be/staging
            pnpm install
            pnpm run build

      - name: Copy env, install, build, migrate, and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/openprofile-be

            # Env file
            cp envfile/.env.staging staging/.env

            cd staging

            pnpm install
            pnpm run build

            # Run migrations
            pnpm run migration:run

            pm2 restart openprofile-staging-be || pm2 start "pnpm start" --name openprofile-staging-be
            pm2 save

  
  # ─── Deploy — Production ───────────────
  deploy-production:
    name: Deploy — Production
    needs: ci
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') || (github.event_name == 'push' && github.ref == 'refs/heads/production')
    #environment: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean stale source files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            rm -rf /var/www/openprofile-be/main/src

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./"
          target: /var/www/openprofile-be/main

      - name: Copy env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/openprofile-be
            cp envfile/.env.prod  main/.env

      - name: Install dependencies and build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/openprofile-be/main
            pnpm install
            pnpm run build
            
            # Run migrations
            pnpm run migration:run

      - name: Start app with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /var/www/openprofile-be/main
            pm2 restart openprofile-main-be || pm2 start "pnpm run start:prod" --name openprofile-main-be
            pm2 save