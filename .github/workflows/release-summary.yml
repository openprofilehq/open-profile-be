name: Release Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, production]

concurrency:
  group: release-summary-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-summary:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      SUMMARY_PATH: /tmp/release-summary.md

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 11

      - uses: actions/setup-node@0355742c943ddb13ca8a6b700f824231caa91e75
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install

      - name: Set up branch refs
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          if ! git branch "$BASE_REF" "origin/$BASE_REF" 2>/dev/null; then
            echo "::error::Failed to create local branch '$BASE_REF' from 'origin/$BASE_REF'. Fetch output above."
            exit 1
          fi
          if ! git branch "$HEAD_REF" "origin/$HEAD_REF" 2>/dev/null; then
            echo "::error::Failed to create local branch '$HEAD_REF' from 'origin/$HEAD_REF'. Fetch output above."
            exit 1
          fi

      - name: Generate release summary
        run: |
          node tools/release-cli.js \
            "$BASE_REF" \
            "$HEAD_REF" > "$SUMMARY_PATH"
          echo "Generated summary:"
          cat "$SUMMARY_PATH"

      - name: Verify release summary was generated
        run: |
          if [ ! -f "$SUMMARY_PATH" ]; then
            echo "::error::Release summary was not generated at $SUMMARY_PATH"
            exit 1
          fi
          echo "Release summary found ($(wc -l < "$SUMMARY_PATH") lines)"

      - name: Post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/post-release-summary.sh \
            "$SUMMARY_PATH" \
            "${{ github.event.pull_request.number }}" \
            "$BASE_REF"